
{% extends "base.html" %}

{% block title %}Admin Management{% endblock %}

{% block content %}
<div class="container" style="max-width: 1100px; margin: 40px auto; padding: 20px;">
    <h1>Admin Management</h1>
    <p>Manage your college event registration database.</p>

    <div style="display: flex; flex-wrap: wrap; gap: 20px; margin-top: 30px;">
        {% for section in sections %}
        <a href="{{ section.url }}"
           style="display: block; flex: 1 1 220px; padding: 25px;
                  border: 1px solid #ddd; border-radius: 12px;
                  text-decoration: none; color: inherit;
                  background: #f8f9fa;">
            <h2>{{ section.name }}</h2>
            <span>View and manage records →</span>
        </a>
        {% endfor %}
    </div>

    <p style="margin-top: 30px;">
        <a href="{{ url_for('admin_dashboard') }}">← Back to Admin Dashboard</a>
    </p>
</div>
{% endblock %}
